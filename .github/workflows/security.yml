name: Security Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.177.0"

      - name: Verify Semgrep version
        run: semgrep --version

      - name: Validate custom Semgrep rules
        run: semgrep --validate --config .semgrep/authorization.yml

      - name: Test custom Semgrep rules
        run: semgrep --test --config .semgrep/authorization.yml .semgrep/authorization.ts

      - name: SAST (Semgrep)
        run: |
          semgrep \
            --config p/javascript \
            --config p/typescript \
            --config p/nextjs \
            --config p/owasp-top-ten \
            --config .semgrep/authorization.yml \
            .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Package production build
        run: |
          tar -czf communitypulse-next-build.tar.gz .next
          sha256sum communitypulse-next-build.tar.gz

      # NOTE: GitHub artifact attestations are only supported on public repos
      # (or GitHub Enterprise Cloud for private repos). This step is gated
      # so it skips silently on the private repo instead of failing the job.
      - name: Attest production build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: communitypulse-next-build.tar.gz

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: communitypulse-next-build
          path: communitypulse-next-build.tar.gz

      # KNOWN, DOCUMENTED RISK: next@14.2.35 has multiple unpatched high-severity
      # advisories (DoS, SSRF, cache poisoning, XSS via CSP nonces). Next.js
      # 13.x/14.x are past their security-patch window per Vercel (no fix will
      # land on the 14.x line). The available fix (next@16.x) previously broke
      # this app's Clerk middleware + Prisma edge connectivity when tested
      # locally (see docs/security/known-risks.md and day1-build-log.md for
      # the full story). Deliberately not force-upgrading here; continue-on-error
      # keeps this finding VISIBLE in every CI run instead of hiding it, while
      # not hard-blocking the pipeline on a risk we've made a documented call
      # about. Proper upgrade evaluation is scoped to Project 9 (supply chain /
      # release security) — see docs/security/known-risks.md.
      - name: Dependency audit (SCA)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Project 5 (Cloud & IaC Hardening): if config-as-code is added for
      # Cloudflare/Vercel settings, Checkov scans it here. Left as a
      # separate, non-blocking step until that IaC exists in the repo.
      - name: IaC/config scan (Checkov)
        if: hashFiles('**/*.tf') != ''
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          quiet: true

  canary:
    name: Canary Gate (Preview Deployment Security Check)
    needs: [security]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deploys THIS PR's exact code to a real Vercel preview and captures
      # its URL — the canary gate scans this specific candidate release,
      # not a stale or shared staging environment.
      - name: Deploy PR to Vercel Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel build --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # Reuses Project 8's Scenario 1 script unmodified. Its own
      # thresholds block (attack_requests_blocked: ['rate>=0.95']) IS the
      # pass/fail gate: k6 exits non-zero on threshold failure, which
      # fails this job, which blocks merge per branch protection.
      - name: Run canary security check (rate-limit verification)
        uses: grafana/run-k6-action@v1
        env:
          STAGING_URL: ${{ steps.deploy.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          path: docs/security/scenario-1-bulk-scrape.k6.js
