name: Security Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write
  
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.177.0"

      - name: Verify Semgrep version
        run: semgrep --version

      - name: Validate custom Semgrep rules
        run: semgrep --validate --config .semgrep/authorization.yml

      - name: Test custom Semgrep rules
        run: semgrep --test --config .semgrep/authorization.yml .semgrep/authorization.ts

      - name: SAST (Semgrep)
        run: |
          semgrep \
            --config p/javascript \
            --config p/typescript \
            --config p/nextjs \
            --config p/owasp-top-ten \
            --config .semgrep/authorization.yml \
            .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package production build
        run: |
          tar -czf communitypulse-next-build.tar.gz .next
          sha256sum communitypulse-next-build.tar.gz

      - name: Attest production build provenance
        uses: actions/attest@v4
        with:
          subject-path: communitypulse-next-build.tar.gz

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: communitypulse-next-build
          path: communitypulse-next-build.tar.gz

      # KNOWN, DOCUMENTED RISK: next@14.2.35 has multiple unpatched high-severity
      # advisories (DoS, SSRF, cache poisoning, XSS via CSP nonces). Next.js
      # 13.x/14.x are past their security-patch window per Vercel (no fix will
      # land on the 14.x line). The available fix (next@16.x) previously broke
      # this app's Clerk middleware + Prisma edge connectivity when tested
      # locally (see docs/security/known-risks.md and day1-build-log.md for
      # the full story). Deliberately not force-upgrading here; continue-on-error
      # keeps this finding VISIBLE in every CI run instead of hiding it, while
      # not hard-blocking the pipeline on a risk we've made a documented call
      # about. Proper upgrade evaluation is scoped to Project 9 (supply chain /
      # release security) — see docs/security/known-risks.md.
      - name: Dependency audit (SCA)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Project 5 (Cloud & IaC Hardening): if config-as-code is added for
      # Cloudflare/Vercel settings, Checkov scans it here. Left as a
      # separate, non-blocking step until that IaC exists in the repo.
      - name: IaC/config scan (Checkov)
        if: hashFiles('**/*.tf') != ''
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          quiet: true
